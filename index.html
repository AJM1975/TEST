<!DOCTYPE html>
<html>
<head>
  <title>Toastmasters Table Topic Generator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      transition: background-color 0.5s;
    }

    #question {
      font-size: 36px;
      margin: 40px;
      min-height: 120px;
    }

    #timer {
      font-size: 72px;
      font-weight: bold;
      margin: 30px;
    }

    button, a.download-button {
      font-size: 20px;
      padding: 12px 24px;
      margin: 10px;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid #333;
      text-decoration: none;
      display: inline-block;
      background: #f2f2f2;
      color: #000;
    }

    .flash {
      animation: flash 0.5s infinite;
    }

    @keyframes flash {
      0% { background-color: red; }
      50% { background-color: white; }
      100% { background-color: red; }
    }
  </style>
</head>

<body>

  <h1>🎤 Toastmasters Table Topics</h1>

  <div id="question"></div>

  <div id="timer">00:00</div>

  <label style="font-size:20px;">
    <input type="checkbox" id="recordOption">
    Record this response
  </label>

  <br><br>

  <button onclick="newQuestion()">New Question</button>
  <button onclick="startSession()">Start</button>
  <button onclick="stopSession()">Stop</button>
  <button onclick="resetTimer()">Reset</button>

  <br>

  <a id="downloadLink" class="download-button" style="display:none;">
    Download Recording
  </a>

<script>
const questions = [
  "If animals could talk, which would be the rudest?",
  "What invention should never have been invented?",
  "If you were invisible for one day, what would you do?",
  "What is your most useless talent?",
  "What would your autobiography be called?",
  "If your pet became president, what would happen first?",
  "What is something everyone pretends to understand?",
  "If toast could talk, what would it say?",
  "What would you ban immediately if you ruled the world?",
  "What is the strangest thing you've ever eaten?",
  "If you could relive one day, which would it be?",
  "What advice would you give your younger self?",
  "What makes a great leader?",
  "What skill should every person learn?",
  "What is one thing technology has improved?",
  "What is one thing technology has ruined?",
  "What does success mean to you?",
  "What is the best lesson you've learned?",
  "What would you do with a million dollars?",
  "What would your dream retirement look like?"
];

let secondsElapsed = 0;
let timerInterval = null;

let mediaRecorder = null;
let audioChunks = [];
let audioStream = null;

function newQuestion() {
  document.body.classList.remove("flash");

  const randomIndex = Math.floor(Math.random() * questions.length);

  document.getElementById("question").innerHTML = questions[randomIndex];

  resetTimer();
  hideDownloadLink();
}

function startSession() {
  startTimer();

  const shouldRecord = document.getElementById("recordOption").checked;

  if (shouldRecord) {
    startRecording();
  }
}

function stopSession() {
  clearInterval(timerInterval);

  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
  }

  if (audioStream) {
    audioStream.getTracks().forEach(track => track.stop());
  }
}

function startTimer() {
  clearInterval(timerInterval);

  timerInterval = setInterval(function() {
    secondsElapsed++;

    const minutes = Math.floor(secondsElapsed / 60);
    const seconds = secondsElapsed % 60;

    document.getElementById("timer").innerHTML =
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0");

    if (secondsElapsed >= 150) {
      document.body.classList.add("flash");
    } else if (secondsElapsed >= 120) {
      document.body.classList.remove("flash");
      document.body.style.backgroundColor = "red";
    } else if (secondsElapsed >= 90) {
      document.body.style.backgroundColor = "orange";
    } else if (secondsElapsed >= 60) {
      document.body.style.backgroundColor = "lightgreen";
    }
  }, 1000);
}

function resetTimer() {
  clearInterval(timerInterval);

  secondsElapsed = 0;

  document.body.classList.remove("flash");
  document.body.style.backgroundColor = "white";

  document.getElementById("timer").innerHTML = "00:00";
}

async function startRecording() {
  try {
    hideDownloadLink();

    audioChunks = [];

    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });

    mediaRecorder = new MediaRecorder(audioStream);

    mediaRecorder.ondataavailable = function(event) {
      if (event.data.size > 0) {
        audioChunks.push(event.data);
      }
    };

    mediaRecorder.onstop = function() {
      const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
      const audioUrl = URL.createObjectURL(audioBlob);

      const downloadLink = document.getElementById("downloadLink");
      downloadLink.href = audioUrl;
      downloadLink.download = "table-topic-recording.webm";
      downloadLink.style.display = "inline-block";
    };

    mediaRecorder.start();

  } catch (error) {
    alert("Recording could not start. Check microphone permissions.");
    console.error(error);
  }
}

function hideDownloadLink() {
  const downloadLink = document.getElementById("downloadLink");
  downloadLink.style.display = "none";
  downloadLink.removeAttribute("href");
}

newQuestion();
</script>

</body>
</html>
